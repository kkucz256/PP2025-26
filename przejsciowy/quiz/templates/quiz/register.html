{% comment %} quiz/templates/quiz/register.html {% endcomment %}

<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Rejestracja Użytkownika</title>
    <style>
        /* Proste style Dark Theme */
        body { font-family: Arial, sans-serif; background-color: #2e3440; color: #eceff4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .register-container { background-color: #3b4252; padding: 30px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); width: 350px; }
        h2 { text-align: center; color: #a3be8c; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #e5e9f0; }
        input[type="text"], input[type="email"], input[type="password"] { width: 100%; padding: 10px; border: 1px solid #4c566a; border-radius: 4px; box-sizing: border-box; background-color: #434c5e; color: #eceff4; }
        button { width: 100%; padding: 10px; background-color: #8fbcbb; border: none; border-radius: 4px; color: black; font-size: 16px; cursor: pointer; transition: background-color 0.3s; }
        button:hover { background-color: #a3be8c; }
        .error { color: #bf616a; text-align: center; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="register-container">
        <h2>Rejestracja</h2>

        {% if error_message %}
            <p class="error">{{ error_message }}</p>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Nazwa użytkownika:</label>
                <input type="text" id="username" name="username" required>
            </div>

            <div class="form-group">
                <label for="mail">E-mail:</label>
                <input type="email" id="mail" name="mail" required>
            </div>

            <div class="form-group">
                <label for="password">Hasło:</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="form-group">
                <label for="password_confirm">Potwierdź Hasło:</label>
                <input type="password" id="password_confirm" name="password_confirm" required>
            </div>

            <button type="submit">Zarejestruj się</button>
        </form>

        <p style="text-align: center; margin-top: 20px;">
            <a href="{% url 'quiz:login' %}" style="color: #5e81ac;">Masz już konto? Zaloguj się</a>
        </p>
    </div>
</body>
</html>
