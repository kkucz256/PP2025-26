<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edytuj Pytania - Generator Quizów</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'quiz/css/review_questions.css' %}">
</head>
<body>
    <div class="main-container">
        <header>
            <h1>Edycja wygenerowanych pytań</h1>
            <a href="{% url 'quiz:upload_pdf_view' %}" class="btn-secondary">Anuluj</a>
        </header>

        <form method="post" action="{% url 'quiz:review_questions_view' %}" id="quiz-form">
            {% csrf_token %}
            
            <div class="panel quiz-meta">
                <label for="quiz_name">Nazwa Twojego Quizu</label>
                <input type="text" name="quiz_name" id="quiz_name" 
                       placeholder="Np. Kolokwium z Anatomii - Układ Krążenia" 
                       required class="title-input">
            </div>

            <div class="questions-list">
                {% for q in questions %}
                <div class="panel question-card">
                    <div class="q-header">
                        <h3>Pytanie <span class="q-index">{{ forloop.counter }}</span></h3>
                        <button type="button" class="btn-delete" onclick="removeQuestion(this)">Usuń</button>
                    </div>
                    
                    <textarea name="q_{{ forloop.counter }}_text" class="edit-q" required>{{ q.question }}</textarea>
                    
                    <div class="options-grid">
                        {% for opt in q.options %}
                        <div class="opt-row">
                            <input type="radio" name="q_{{ forloop.parentloop.counter }}_correct" 
                                   value="{{ forloop.counter0 }}" 
                                   {% if q.correct == forloop.counter0 %}checked{% endif %} required>
                            
                            <input type="text" name="q_{{ forloop.parentloop.counter }}_opt_{{ forloop.counter0 }}" 
                                   value="{{ opt }}" class="edit-opt" required>
                        </div>
                        {% endfor %}
                    </div>
                </div>
                {% endfor %}
            </div>

            <div class="add-action">
                <button type="button" id="add-question-btn" class="btn-secondary">+ Dodaj nowe pytanie ręcznie</button>
            </div>

            <div class="actions">
                <button type="submit" class="btn btn-success btn-large">Zapisz Quiz na stałe</button>
            </div>
        </form>
    </div>

    <script src="{% static 'quiz/js/review_questions.js' %}"></script>
</body>
</html>
