<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edytuj Pytania - Generator Quizów</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'quiz/css/review_questions.css' %}">
</head>
<body>
    <div class="main-container">
        <header>
            <h1>Edycja wygenerowanych pytań</h1>
            <a href="{% url 'quiz:upload_pdf_view' %}" class="btn-secondary">Anuluj</a>
        </header>

        <form id="quiz-form">
            <div class="panel quiz-meta">
                <label for="quiz_name">Nazwa Twojego Quizu</label>
                <input type="text" name="quiz_name" id="quiz_name" 
                       placeholder="Np. Kolokwium z Anatomii - Układ Krążenia" 
                       required class="title-input">
            </div>

            <div class="questions-list" id="questions-container">
                <!-- Pytania będą wstawiane dynamicznie z API -->
            </div>

            <div class="add-action">
                <button type="button" id="add-question-btn" class="btn-secondary">+ Dodaj nowe pytanie ręcznie</button>
            </div>

            <div class="actions">
                <button type="button" id="save-quiz-btn" class="btn btn-success btn-large">Zapisz Quiz na stałe</button>
                <div id="loading-indicator" class="loading-indicator" style="display: none;">
                    <p>Zapisuję quiz...</p>
                </div>
            </div>
        </form>

        <div id="success-message" class="success-message" style="display: none;">
            <p>Quiz został pomyślnie zapisany! Przekierowanie...</p>
        </div>

        <div id="error-message" class="error-message" style="display: none;">
            <p id="error-text"></p>
        </div>
    </div>

    <script src="{% static 'quiz/js/review_questions.js' %}"></script>
    <script>
        // Konfiguracja API
        const API_BASE_URL = '/api/quiz';
        const CSRF_TOKEN = '{{ csrf_token }}';
        const USER_ID = {{ request.session.user_id|default:'null' }};
        
        // Inicjalne pytania z sesji
        const initialQuestions = {{ questions_json|safe }};
        console.log('🔍 DEBUG - initialQuestions z Django:', initialQuestions);
        console.log('🔍 DEBUG - Liczba pytań:', initialQuestions ? initialQuestions.length : 0);
        
        if (initialQuestions && initialQuestions.length > 0) {
            window.initialQuestions = initialQuestions;
            console.log('✓ Pytania wstawione do window.initialQuestions');
        } else {
            console.warn('⚠️ Pytania puste lub undefined!');
        }
    </script>
</body>
</html>
