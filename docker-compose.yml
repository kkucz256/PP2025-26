version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: quiz_db_mysql
    restart: always
    environment:
      MYSQL_DATABASE: quiz_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: devuser
      MYSQL_PASSWORD: devpassword
    ports:
      - "3307:3306"
    volumes:
      - db_data_v2:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql

  web:
    build: .
    container_name: quiz_django
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_NAME=quiz_db
      - DB_USER=devuser
      - DB_PASSWORD=devpassword
      - DB_PORT=3306
      - MIGRATE=true

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama

  frontend:
    build:
      context: ./frontend
    container_name: quiz_frontend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - web
    environment:
      - API_URL=http://web:8000/api

volumes:
  db_data_v2:
  ollama_storage: